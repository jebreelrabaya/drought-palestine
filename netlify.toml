[build]
  command = "pnpm run build:netlify"
  publish = "dist/public"
  functions = "netlify/functions"

[build.environment]
  NODE_VERSION = "22"
  # Vite 7 and friends live in devDependencies; Netlify prunes them without this.
  NPM_FLAGS = "--production=false"

[functions]
  node_bundler = "esbuild"
  # Everything is inlined. Do NOT mark mysql2 (or anything else) external:
  # under pnpm's symlinked store Netlify can fail to copy externals into the
  # function zip, and the function then 503s on load with MODULE_NOT_FOUND.

# API traffic goes to the Express function; everything else is the SPA.
[[redirects]]
  from = "/api/*"
  to = "/.netlify/functions/api"
  status = 200
  force = true

[[redirects]]
  from = "/manus-storage/*"
  to = "/.netlify/functions/api"
  status = 200
  force = true

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
